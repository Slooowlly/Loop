[package]
name = "loop"
version = "0.14.0"
description = "Loop"
authors = ["you"]
edition = "2021"

[lib]
name = "loop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# Auto-update: checa o endpoint, baixa e instala o novo build (assinado).
# tauri-plugin-process expõe o relaunch() usado após instalar a atualização.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
notify = "6"
thiserror = "1"
uuid = { version = "1.22.0", features = ["v4"] }
# Cliente HTTP p/ o servidor de boletins de IA. rustls (sem OpenSSL) p/ build limpo no Windows.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
# i18n do backend (texto determinístico + "fatos" pra IA). Locale global setado
# do config.language no boot e na troca em Settings. Ver docs/i18n-translation-spec.md.
rust-i18n = "3"
# Compressão do gravador de corrida (debug): o JSONL cru passa de 200 MB em 15 min
# de captura a 60 Hz. Ver iracing_sdk/race_capture.rs.
flate2 = "1.1"

# Testes que dependem do LOCALE global (prosa i18n do backend) precisam rodar
# serializados: o locale do rust-i18n é um estado de processo. `#[serial]` garante
# que o i18n_smoke (que troca pra en-US) não corra junto de testes que asseveram
# prosa PT. Ver docs/i18n-translation-spec.md (Fase 3, padrão de teste).
[dev-dependencies]
serial_test = "3"
# Só nos testes: lê os YAML de locale p/ o guard de paridade (chaves pt-BR == en-US).
serde_yaml = "0.9"

# Teste do SDK do iRacing (binding manual da shared memory). Só em Windows.
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = [
    "memoryapi",
    "handleapi",
    "errhandlingapi",
    "ntdef",
    "minwindef",
    "windef",
    "processthreadsapi",
    "winuser",
    # Elevação do processo no diagnóstico do iRacing: sem saber se rodamos como
    # administrador, "acesso negado" à memória do SDK fica sem explicação.
    "securitybaseapi",
    "winnt",
    # Camada de VR (`commands/vr_layer.rs`): detecta o runtime de VR ativo por evento
    # nomeado (synchapi) e lê o caminho de instalação do registro (winreg).
    "synchapi",
    "winreg",
    "combaseapi",
    "knownfolders",
    "shlobj",
    "shtypes",
] }

# Otimização do binário de release (o que vai pro jogador).
# Sem este bloco, o loop.exe embarca símbolos de debug (~115 MB).
# strip: remove símbolos (maior corte, sem custo de runtime).
# lto + codegen-units=1: enxugam o código (build de release mais lento).
# opt-level="s": prioriza tamanho. panic="abort": remove código de unwinding.
[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"
