[package]
name = "loop"
version = "0.1.0"
description = "Loop"
authors = ["you"]
edition = "2021"

[lib]
name = "loop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
notify = "6"
thiserror = "1"
uuid = { version = "1.22.0", features = ["v4"] }
# Cliente HTTP p/ o servidor de boletins de IA. rustls (sem OpenSSL) p/ build limpo no Windows.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

# Teste do SDK do iRacing (binding manual da shared memory). Só em Windows.
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = [
    "memoryapi",
    "handleapi",
    "errhandlingapi",
    "ntdef",
    "minwindef",
    "windef",
    "processthreadsapi",
    "winuser",
    "combaseapi",
    "knownfolders",
    "shlobj",
    "shtypes",
] }
