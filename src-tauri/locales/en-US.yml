# Post-race brain (race_eval.rs): assessment, headline and package read.
# %{...} = rust-i18n interpolation. `assessment` is the already-translated label
# embedded in the headline. Ordinals arrive as "P8" (the `ord` helper).
race_eval:
  assessment:
    muito_acima: "well above expectations"
    acima: "above expectations"
    dentro: "in line with expectations"
    abaixo: "below expectations"
    muito_abaixo: "well below expectations"
  headline:
    dnf: "DNF at %{pos}. A weekend to forget — the priority is to bring the car home in one piece next time."
    recovery: "Strong recovery drive: started %{grid} and finished %{finish}, gaining %{gained} positions — %{assessment}."
    solid: "Solid result, %{assessment}: %{grid} → %{finish}, better than the race target called for."
    dentro: "A race in line with expectations: %{grid} → %{finish}, delivering the realistic target for the day."
    below_lost: "Result %{assessment}: started %{grid} and lost positions down to %{finish}. There was more on the table."
    below: "Result %{assessment}: %{grid} → %{finish} fell short of the race target."
  team_read:
    dnf: "The DNF masked what the package had to offer this weekend."
    above: "You delivered ABOVE what the car promised — the driving made the difference."
    limit: "You delivered near the package's ceiling — you extracted what the car had."
    below: "The package had more to give; there was pace left in the garage that never turned into positions."

# "From the World of the Grid" footer (commands/world_footer.rs). MAGAZINE VOICE (3rd person).
# `tag` = themed label shown; `tone`/`kind` stay out (CSS/state tokens).
# `metric_noun` singular/plural per record metric (%{ord} = pre-formatted ordinal).
world_footer:
  tag:
    market: "MARKET"
    finance: "FINANCES"
    backstage: "BACKSTAGE"
    record: "RECORD"
  metric_noun:
    wins:
      one: "win"
      other: "wins"
    podiums:
      one: "podium"
      other: "podiums"
    poles:
      one: "pole"
      other: "poles"
    titles:
      one: "title"
      other: "titles"
    starts:
      one: "start"
      other: "starts"
  team_state:
    new_board: "A shake-up behind the scenes: %{team} has gone through a change of command after several tough years."
    debt: "Word in the paddock is that %{team} is piling up debt and struggling to close out the season's books."
    tight_budget: "%{team} is going through a delicate financial stretch and running right at the edge of its budget this year."
    bad_mood: "The mood inside %{team} is heavy: results below expectations have rattled the garage."
  teammate:
    team_crisis: "%{mate} is having a rough year: %{team}, their current squad, is facing financial trouble."
  record_broken:
    lap_record: "%{name} set the fastest lap in history at %{context}: %{lap} (previous record: %{prev})."
    comeback: "%{name} pulled off the greatest comeback in category history: up %{value} positions in a single race."
    season_wins_prev: "%{name} reached %{value} wins in a single season — a new category record, beating the previous mark of %{prev}."
    season_wins: "%{name} reached %{value} wins in a single season — a category record."
    track_wins: "%{name} is the all-time winningest driver at %{context}, now with %{value} wins at the circuit."
    win_streak: "%{name} won %{value} races in a row — the category's streak record."
    constructor_titles: "%{name} clinched its %{ord} constructors' title — a category record."
    team_wins: "%{name} became the winningest team in category history, with %{value} wins."
    one_two: "%{name} scored its %{ord} one-two finish — a category record."
    youngest_winner: "%{name}, at %{value}, became the youngest winner in category history."
    oldest_winner: "%{name}, at %{value}, became the oldest winner in category history."
    youngest_champion: "%{name} was crowned champion at %{value} — the youngest in category history."
    most_chaotic_race: "%{name} lived through the most chaotic race in category history: %{value} retirements."
    drought_broken: "%{name} won again after %{value} seasons of drought — the longest ever broken in the category."
    closest_championship_tie: "%{name} took the title in the closest finish in category history — level on points, decided on the tiebreaker."
    closest_championship: "%{name} took the title in the closest finish in category history: %{value} points apart."
    biggest_blowout: "%{name} dominated the most lopsided season in category history: %{value} points clear of the runner-up."
    longest_pairing: "%{name} — %{value} seasons together, the longest-running partnership in category history."
    most_starts_no_win: "%{name} passed %{context} as the driver with the most starts without a win in the category: %{value}."
    most_career_dnfs: "%{name} passed %{context} and now has the most retirements in category history: %{value} DNFs."
    most_poles_no_title: "%{name} passed %{context}: %{value} poles without ever being champion — a category record."
    most_career_points: "%{name} passed %{context} to become the all-time points leader in category history."
    generic_prev: "%{name} made history: broke the category's %{noun} record, now at %{value} (the previous mark was %{prev})."
    generic: "%{name} made history by setting the category's new %{noun} record: %{value}."
  record_watch:
    tied: "%{name} matched the category's all-time %{noun} record: %{value}, %{holder}'s mark."
    approaching: "%{name} is %{gap} %{noun} away from matching the category's all-time record (%{value}, held by %{holder})."
  star:
    idol: "%{name} is the category's biggest crowd-puller: wherever they race, the grandstands fill up and sponsors line up."
    star: "%{name} has become one of the category's big names and draws crowds to the circuits — guaranteed attendance wherever they compete."

