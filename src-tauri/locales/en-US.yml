    nth: "bid %{n}"
  poach_outcome:
    expired: "The offer expired."
    stayed: "You stayed at %{team}."
    unavailable: "The suitor is no longer available."
    signed: "You signed with %{team}."
  event:
    deal: "Deal in %{category}."
    window_closed_headline: "Transfer window closed"
    window_closed_desc: "The market is closed."
    departure_headline: "%{driver} leaves %{team}"
    contract_ended: "Contract ended without renewal."

