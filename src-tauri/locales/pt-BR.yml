# Cérebro pós-corrida (race_eval.rs): avaliação, manchete e leitura do conjunto.
# %{...} = interpolação do rust-i18n. `assessment` é o rótulo já traduzido,
# embutido na manchete. Ordinais chegam como "P8" (helper `ord`).
race_eval:
  assessment:
    muito_acima: "muito acima do esperado"
    acima: "acima do esperado"
    dentro: "dentro do esperado"
    abaixo: "abaixo do esperado"
    muito_abaixo: "muito abaixo do esperado"
  headline:
    dnf: "Abandono em %{pos}. Fim de semana para esquecer — o importante é trazer o carro inteiro na próxima."
    recovery: "Corrida forte de recuperação: largou %{grid} e terminou %{finish}, ganhando %{gained} posições — %{assessment}."
    solid: "Resultado sólido %{assessment}: %{grid} → %{finish}, melhor do que a meta da corrida pedia."
    dentro: "Corrida dentro do esperado: %{grid} → %{finish}, entregando a meta realista do dia."
    below_lost: "Resultado %{assessment}: largou %{grid} e perdeu posições até %{finish}. Havia mais ali."
    below: "Resultado %{assessment}: %{grid} → %{finish} ficou aquém da meta da corrida."
  team_read:
    dnf: "O abandono mascarou o que o conjunto tinha a oferecer neste fim de semana."
    above: "Você entregou ACIMA do que o carro prometia — a pilotagem fez a diferença."
    limit: "Você entregou perto do limite do conjunto — extraiu o que o carro tinha."
    below: "O conjunto tinha mais a oferecer; sobrou ritmo na garagem que não virou posição."

# Rodapé "Do mundo do Grid" (commands/world_footer.rs). VOZ DE REVISTA (3ª pessoa).
# `tag` = rótulo temático exibido; `tone`/`kind` NÃO ficam aqui (tokens de CSS/máquina).
# `metric_noun` singular/plural por métrica de recorde (%{ord} = ordinal já formatado).
world_footer:
  tag:
    market: "MERCADO"
    finance: "FINANÇAS"
    backstage: "BASTIDORES"
    record: "RECORDE"
  metric_noun:
    wins:
      one: "vitória"
      other: "vitórias"
    podiums:
      one: "pódio"
      other: "pódios"
    poles:
      one: "pole"
      other: "poles"
    titles:
      one: "título"
      other: "títulos"
    starts:
      one: "largada"
      other: "largadas"
  team_state:
    new_board: "Reviravolta nos bastidores: a %{team} passou por uma troca de comando depois de anos difíceis."
    debt: "Rumores no paddock dão conta de que a %{team} acumula dívidas e luta para fechar as contas da temporada."
    tight_budget: "A %{team} atravessa um momento financeiro delicado e opera no limite do orçamento neste ano."
    bad_mood: "O ambiente interno da %{team} pesa: o rendimento abaixo do esperado abalou o vestiário."
  teammate:
    team_crisis: "%{mate} vive um ano conturbado: a %{team}, sua equipe atual, enfrenta dificuldades financeiras."
  record_broken:
    lap_record: "%{name} fez a volta mais rápida da história em %{context}: %{lap} (recorde anterior: %{prev})."
    comeback: "%{name} protagonizou a maior recuperação da história da categoria: subiu %{value} posições numa única corrida."
    season_wins_prev: "%{name} chegou a %{value} vitórias numa única temporada — novo recorde da categoria, superando a marca de %{prev}."
    season_wins: "%{name} chegou a %{value} vitórias numa única temporada — recorde da categoria."
    track_wins: "%{name} é o maior vencedor da história em %{context}, agora com %{value} vitórias no circuito."
    win_streak: "%{name} venceu %{value} corridas seguidas — recorde de sequência da categoria."
    constructor_titles: "A %{name} conquistou seu %{ord} título de construtores — recorde da categoria."
    team_wins: "A %{name} tornou-se a maior vencedora da história da categoria, com %{value} vitórias."
    one_two: "A %{name} chegou à sua %{ord} dobradinha (1-2) — recorde da categoria."
    youngest_winner: "%{name}, aos %{value} anos, tornou-se o mais jovem a vencer na história da categoria."
    oldest_winner: "%{name}, aos %{value} anos, tornou-se o mais velho a vencer na história da categoria."
    youngest_champion: "%{name} sagrou-se campeão aos %{value} anos — o mais jovem da história da categoria."
    most_chaotic_race: "%{name} viveu a corrida mais caótica da história da categoria: %{value} abandonos."
    drought_broken: "%{name} voltou a vencer após %{value} temporadas de jejum — o maior já quebrado na categoria."
    closest_championship_tie: "%{name} levou o título na decisão mais apertada da história da categoria — empatado em pontos, no critério de desempate."
    closest_championship: "%{name} levou o título na decisão mais apertada da história da categoria: %{value} pontos de diferença."
    biggest_blowout: "%{name} dominou a temporada mais desequilibrada da história da categoria: %{value} pontos à frente do vice."
    longest_pairing: "%{name} — %{value} temporadas juntos, a parceria mais longeva da história da categoria."
    most_starts_no_win: "%{name} superou %{context} como o piloto com mais largadas sem vencer na categoria: %{value}."
    most_career_dnfs: "%{name} passou %{context} e é agora quem mais abandonou na história da categoria: %{value} DNFs."
    most_poles_no_title: "%{name} superou %{context}: %{value} poles sem nunca ter sido campeão — recorde da categoria."
    most_career_points: "%{name} superou %{context} e tornou-se o maior pontuador da história da categoria."
    generic_prev: "%{name} entrou para a história: quebrou o recorde de %{noun} da categoria, agora em %{value} (a marca anterior era %{prev})."
    generic: "%{name} entrou para a história ao estabelecer o novo recorde de %{noun} da categoria: %{value}."
  record_watch:
    tied: "%{name} igualou o recorde histórico de %{noun} da categoria: %{value}, marca de %{holder}."
    approaching: "%{name} está a %{gap} %{noun} de igualar o recorde histórico da categoria (%{value}, de %{holder})."
  star:
